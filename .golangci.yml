version: "2"

formatters:
  enable:
    - gci
    - gofumpt
    - goimports
    - golines

linters:
  enable:
    - gosec
  settings:
    gosec:
      excludes:
        # Pre-existing proto/binary integer conversions; values are API-bounded.
        - G115
        # Struct field name pattern matching — data carrier types, not hardcoded secrets.
        - G117
        # SSRF/XSS taint analysis — SDK HTTP clients/servers call user-provided URLs by design.
        - G704
        - G705

  exclusions:
    rules:
      # Test files: hardcoded test tokens/URLs and test file I/O are not vulnerabilities.
      - path: "_test\\.go"
        linters:
          - gosec
        text: "G101|G304|G306"
      # CLI: reading user-supplied credential files and binding a dev server is intentional.
      - path: "cmd/ileap/"
        linters:
          - gosec
        text: "G112|G304"
